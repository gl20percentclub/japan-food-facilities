<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>プライバシー・外部送信についてのページは新しいドメインへ移転しました</title>
  <!-- gh-pages（このドメイン）から新ドメイン（food.japan-facilities.com）への移行用スタブ。
       有効化の手順は redirect-stubs/README.md を参照（まだ site/ には配置していない）。 -->
  <meta http-equiv="refresh" content="0; url=https://food.japan-facilities.com/privacy.html">
  <link rel="canonical" href="https://food.japan-facilities.com/privacy.html">
  <meta name="robots" content="noindex">

  <!-- アクセス解析（GA4）。測定IDと発火条件は analytics.js に集約している。
       このページ自身が外部送信の公表ページなので、循環を避けるため privacy.html への
       リンクは置いていない（移転先の同ページを読めば済む）。 -->
  <script src="./analytics.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #1f2933;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
      padding: 24px;
    }
    a { color: #e8563f; }
  </style>
</head>
<body>
  <p>
    プライバシー・外部送信についてのページは <strong>https://food.japan-facilities.com/privacy.html</strong> へ移転しました。<br>
    自動で移動しない場合は <a href="https://food.japan-facilities.com/privacy.html">新しいページ</a> を開いてください。
  </p>
</body>
</html>
