<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>検索プレイグラウンドは地図ページに統合されました — Japan Food Facilities</title>
  <!-- 検索プレイグラウンドは map.html（地図と検索）へ統合した。
       公開済みの URL からのアクセスを壊さないよう、このページはリダイレクトだけ行う。 -->
  <meta http-equiv="refresh" content="0; url=./map.html">
  <link rel="canonical" href="./map.html">
  <meta name="robots" content="noindex">

  <!-- アクセス解析（GA4）。測定IDと発火条件は analytics.js に集約している。
       リダイレクト用のページだが、旧 URL がまだどれだけ踏まれているかを知りたいので
       ここにも入れている。外部送信の内容は privacy.html で公表している。 -->
  <script src="./analytics.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #1f2933;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }
    a { color: #e8563f; }
  </style>
</head>
<body>
  <p>
    検索プレイグラウンドは<strong>地図ページ</strong>に統合されました。<br>
    自動で移動しない場合は <a href="./map.html">地図と検索ページ</a> を開いてください。
  </p>
  <!-- 計測タグを置いているページからは、必ず外部送信の公表ページへ辿れるようにする -->
  <p><a href="./privacy.html">プライバシー・外部送信について</a></p>
</body>
</html>
