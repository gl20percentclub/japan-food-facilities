<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ページが見つかりません — Japan Food Facilities</title>
  <!-- gh-pages の任意の未知パスをこの 404 が受ける（GitHub Pages の仕様で公開ディレクトリ
       直下の 404.html が自動的に使われる）。パスごとの対応表を持たずに新ドメインへ誘導したい
       ので、パスの付け替えは JS で行う（meta refresh は固定 URL しか書けないため）。
       JS が無効な場合は noscript 側のフォールバックで新ドメインのトップへ飛ぶ。
       有効化の手順は redirect-stubs/README.md を参照（まだ site/ には配置していない）。 -->
  <link rel="canonical" href="https://food.japan-facilities.com/">
  <meta name="robots" content="noindex">

  <!-- JS が有効な場合はパス・クエリを引き継いで新ドメインの同じパスへ即座に移動する。
       新ドメイン側に対応するパスが無ければ、新ドメイン側の 404 になるだけで済む。 -->
  <script>
    (function () {
      var target = 'https://food.japan-facilities.com' + location.pathname + location.search;
      location.replace(target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://food.japan-facilities.com/">
  </noscript>

  <!-- アクセス解析（GA4）。測定IDと発火条件は analytics.js に集約している。
       外部送信の内容は privacy.html で公表している。 -->
  <script src="./analytics.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #1f2933;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
      padding: 24px;
    }
    a { color: #e8563f; }
  </style>
</head>
<body>
  <p>
    このページは見つかりませんでした。<br>
    サイトは <strong>https://food.japan-facilities.com/</strong> へ移転しました。<br>
    自動で移動しない場合は <a href="https://food.japan-facilities.com/">新しいサイト</a> を開いてください。
  </p>
  <!-- 計測タグを置いているページからは、必ず外部送信の公表ページへ辿れるようにする -->
  <p><a href="https://food.japan-facilities.com/privacy.html">プライバシー・外部送信について</a></p>
</body>
</html>
