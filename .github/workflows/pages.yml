name: Deploy Pages

# 静的ページ（LP・プレビュー地図・出典表示）を main への push で gh-pages に反映する。
# データ（api/）はこのリポジトリでは生成せず、外部の Fargate クローラーが S3 + CloudFront
# へ配信する。ここではページだけを上書きし、gh-pages 上の既存ファイルには触れない
# （keep_files: true）。gh-pages への配信ワークフローはこれ1本だけ。
#
# 自動生成ページ（attribution.html / llms.txt / llms-full.txt）は配信前に必ず
# 生成元（config/sources.yaml・README.md）から作り直す。リポジトリにコミット済みの
# ファイルが古くても、配信されるページは常に main の生成元と一致する。
# （過去に外部の自動コミットで古い attribution.html が main に入り、旧リポジトリ名と
#  除外済みソースが公開ページへ巻き戻る事故があった）
on:
  push:
    branches: [main]
    paths:
      # site/ 配下がそのまま公開サイト。個別に列挙せず一括で拾う。
      - 'site/**'
      - 'README.md'
      - 'config/sources.yaml'
      - 'scripts/generate/attribution.js'
      - 'scripts/generate/llms.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# 短時間に main へ複数 push があっても gh-pages への push が競合しないよう直列化する。
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 生成スクリプトは js-yaml だけで動くため devDependencies は入れない。
      - name: Install dependencies
        run: npm ci --omit=dev

      # 配信するページを生成元から作り直す（コミット済みの内容に依存させない）。
      - name: Regenerate generated pages
        run: |
          npm run build:attribution
          npm run build:llms

      # 配信元は site/ だけ。site/ の中身が gh-pages のルートに置かれるため、
      # 公開 URL は従来どおり /index.html・/map.html・/llms.txt … になる。
      #
      # publish_dir をリポジトリのルート（.）にしていた頃は、README・docs/・config/・
      # package.json まで gh-pages に配信されていた。さらに .gitignore ごと配信されると
      # 配信先の git add --all で api/ が無視され、gh-pages 上のデータが全消えする事故が
      # あったため exclude_assets で個別に除外していた。site/ には .gitignore も
      # node_modules も存在しないので、この危険は構造的に無くなる。
      #
      # keep_files: true なので gh-pages 上の既存ファイルは残したまま、ページだけ
      # 上書きされる。反面ファイル削除は反映されない。ページをリネーム・削除したときは
      # gh-pages 側の旧ファイルが残るため、必要なら手動で消す。
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          keep_files: true
