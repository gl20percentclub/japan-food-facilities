name: CI

# PR と main への push でユニットテストを走らせる。
# クロール処理・生成ドキュメント（attribution.html/llms*.txt）の生成元は private
# リポジトリ（japan-facilities-crawler）へ移行済みのため、ここで走るのは
# site/（LP・プレビュー地図）の整合性テストと、gh-pages への配信ワークフロー設定の
# 検証（scripts/workflows.test.js）だけ。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 配信物（api/）を伴う統合テストはデータが無いと動かないため unit のみ。
      - name: Run unit tests
        run: npm run test:unit
