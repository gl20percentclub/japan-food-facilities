<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>座標の品質ページは新しいドメインへ移転しました — Japan Food Facilities</title>
  <!-- gh-pages（このドメイン）から新ドメイン（food.japan-facilities.com）への移行用スタブ。
       有効化の手順は redirect-stubs/README.md を参照（まだ site/ には配置していない）。 -->
  <meta http-equiv="refresh" content="0; url=https://food.japan-facilities.com/coord-quality.html">
  <link rel="canonical" href="https://food.japan-facilities.com/coord-quality.html">
  <meta name="robots" content="noindex">

  <!-- アクセス解析（GA4）。測定IDと発火条件は analytics.js に集約している。
       リダイレクト用のページだが、旧 URL がまだどれだけ踏まれているかを知りたいので
       ここにも入れている。外部送信の内容は privacy.html で公表している。 -->
  <script src="./analytics.js"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #1f2933;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
      padding: 24px;
    }
    a { color: #e8563f; }
  </style>
</head>
<body>
  <p>
    座標の品質ページは <strong>https://food.japan-facilities.com/coord-quality.html</strong> へ移転しました。<br>
    自動で移動しない場合は <a href="https://food.japan-facilities.com/coord-quality.html">新しいページ</a> を開いてください。
  </p>
  <!-- 計測タグを置いているページからは、必ず外部送信の公表ページへ辿れるようにする -->
  <p><a href="https://food.japan-facilities.com/privacy.html">プライバシー・外部送信について</a></p>
</body>
</html>
